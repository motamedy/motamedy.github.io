name: Refresh ISS orbit

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  tle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the ISS orbital elements from CelesTrak
        run: |
          curl -fsS "https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=TLE" -o iss.tle.new
          grep -q '^1 25544' iss.tle.new && grep -q '^2 25544' iss.tle.new
          mv iss.tle.new data/iss.tle
      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/iss.tle
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh ISS orbit"
          git push
          # pushes made by this workflow's token don't always start a Pages build
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
